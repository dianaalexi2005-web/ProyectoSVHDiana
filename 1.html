<!DOCTYPE html>
<html>

<head>
	<title>HTML CSS JS</title>
	
	<meta charset="UTF-8" />
	
	<script>
	      function saludarUsuario(){
			  // Preguntanos el nombre y lo guardaremos en la variable
			  let nombreVisitante= window.prompt("¿Como te llamas?");


			 // Mostramos el mensaje uniendo el saludo fijo y la variable
			 alert("¡Hola." + nombreVisitante + "!");
		  }
	</script>
</head>
 
  
<body>
	<button onclick="saludarUsuario()">Saludar </button>
</body>

</html>
